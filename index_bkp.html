/* ─── LOGIN MODAL ─── */
const LoginModal = ({ onSuccess, onClose }) => {
  const [email, setEmail] = useState('admin@edunova.app');
  const [password, setPassword] = useState('password');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    setError('');
    if (!email || !password) { setError('Please fill in all fields.'); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); onSuccess(); }, 900);
  };

  return (
    <div class="fixed inset-0 bg-ink/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div class="bg-parchment rounded-2xl shadow-2xl w-full max-w-md p-8 relative animate-fade-up" onClick={e => e.stopPropagation()}>
        <button onClick={onClose} class="absolute top-5 right-5 text-ink/30 hover:text-ink transition-colors">
          <Icon name="close" cls="w-5 h-5" />
        </button>
        <div class="flex items-center gap-2 mb-7">
          <div class="w-8 h-8 bg-cobalt rounded-lg flex items-center justify-center">
            <span class="text-white font-serif text-sm font-bold">E</span>

          <div>
            <label class="text-xs font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Email address</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              class="w-full bg-white border border-ink/12 rounded-xl px-4 py-3 text-sm text-ink focus:border-cobalt focus:ring-2 focus:ring-cobalt/10 transition-all"
              placeholder="admin@school.edu" />
          </div>
          <div>
            <label class="text-xs font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Password</label>

              class="w-full bg-white border border-ink/12 rounded-xl px-4 py-3 text-sm text-ink focus:border-cobalt focus:ring-2 focus:ring-cobalt/10 transition-all"

          </div>
          {error && <p class="text-xs text-rose bg-rose-light px-3 py-2 rounded-lg">{error}</p>}
          <button type="submit" disabled={loading}
            class="w-full bg-cobalt text-white font-medium py-3 rounded-xl hover:bg-cobalt/90 transition-all shadow-lg shadow-cobalt/20 flex items-center justify-center gap-2 disabled:opacity-70">
            {loading ? <><span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span> Signing in…</> : 'Sign in to dashboard →'}

        </form>

      </div>
    </div>
  );
};
